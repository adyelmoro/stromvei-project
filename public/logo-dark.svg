<svg width="620" height="180" viewBox="0 0 620 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StrømVei">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0E1D42"/>
      <stop offset="100%" stop-color="#060C1C"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#B8E8FF"/>
      <stop offset="55%"  stop-color="#2299FF"/>
      <stop offset="100%" stop-color="#0044CC"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.44)"/>
      <stop offset="48%"  stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(0,120,255,0.35)"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.00)"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="55%" r="50%">
      <stop offset="0%"   stop-color="#0066FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.00"/>
    </radialGradient>
    <filter id="boltGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="rgba(200,225,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(160,200,255,0.14)"/>
    </linearGradient>
    <linearGradient id="carCabin" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="rgba(220,238,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(180,215,255,0.20)"/>
    </linearGradient>
    <radialGradient id="portGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#44CCFF" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="rgba(215,232,255,0.92)"/>
    </linearGradient>
    <clipPath id="topHalf">
      <rect x="14" y="14" width="152" height="78"/>
    </clipPath>
  </defs>

  <!-- ── ICON MARK ── -->
  <ellipse cx="90" cy="95" rx="80" ry="78" fill="url(#ambientGlow)"/>
  <rect x="14" y="14" width="152" height="152" rx="40" fill="url(#glassBg)"/>
  <rect x="14" y="14" width="152" height="78" rx="40" fill="url(#shine)" clip-path="url(#topHalf)"/>
  <rect x="14" y="14" width="152" height="152" rx="40" fill="none" stroke="url(#border)" stroke-width="1.5"/>
  <path d="M30 15.5 Q15 15.5 15 30" stroke="rgba(255,255,255,0.62)" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- Car body -->
  <path d="M28,128 C28,128 30,140 42,142 C54,144 60,134 64,132 L116,132 C120,134 126,144 138,142 C150,140 153,128 153,128 C156,122 155,116 148,113 L134,106 C126,100 118,97 106,97 L78,97 C66,97 56,102 48,110 C38,118 30,122 28,128 Z"
        fill="url(#carBody)" stroke="rgba(200,230,255,0.22)" stroke-width="0.8"/>
  <path d="M54,113 C58,105 66,99 78,97 L106,97 C118,97 126,101 132,110 L54,113 Z"
        fill="url(#carCabin)" stroke="rgba(220,240,255,0.18)" stroke-width="0.7"/>
  <path d="M114,113 C120,105 128,100 133,110" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="126" y="104" width="10" height="6" rx="2" fill="rgba(180,220,255,0.25)" stroke="rgba(255,255,255,0.15)" stroke-width="0.6"/>

  <!-- Wheels -->
  <circle cx="44"  cy="145" r="13" fill="rgba(30,50,90,0.7)" stroke="rgba(200,225,255,0.35)" stroke-width="1.5"/>
  <circle cx="44"  cy="145" r="5"  fill="rgba(160,200,255,0.20)"/>
  <circle cx="136" cy="145" r="13" fill="rgba(30,50,90,0.7)" stroke="rgba(200,225,255,0.35)" stroke-width="1.5"/>
  <circle cx="136" cy="145" r="5"  fill="rgba(160,200,255,0.20)"/>
  <rect x="18" y="157" width="144" height="4" rx="2" fill="rgba(255,255,255,0.04)"/>

  <!-- Charging port -->
  <circle cx="153" cy="118" r="7"   fill="#0066FF" opacity="0.25"/>
  <circle cx="153" cy="118" r="4.5" fill="none" stroke="url(#portGlow)" stroke-width="1.5"/>
  <circle cx="153" cy="118" r="2"   fill="#66DDFF"/>

  <!-- Lightning bolt -->
  <path d="M102,18 L62,78 L82,78 L72,108 L118,66 L98,66 Z" fill="#1A88FF" opacity="0.50" filter="url(#boltGlow)"/>
  <path d="M102,18 L62,78 L82,78 L72,108 L118,66 L98,66 Z" fill="url(#bolt)"/>

  <!-- ── WORDMARK ── -->
  <text x="190" y="88"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="54" font-weight="700" letter-spacing="-2.5"
        fill="url(#wordmark)">Strøm</text>
  <line x1="190" y1="98" x2="606" y2="98" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="190" y="151"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="54" font-weight="300" letter-spacing="-1.5"
        fill="#22AAFF">Vei</text>
  <text x="192" y="171"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="400" letter-spacing="3.8"
        fill="rgba(255,255,255,0.28)">LADING I NORGE</text>
</svg>
