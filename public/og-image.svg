<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#060C18"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8E8FF"/>
      <stop offset="55%" stop-color="#2299FF"/>
      <stop offset="100%" stop-color="#0044CC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.00"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Ambient glow behind logo -->
  <ellipse cx="210" cy="315" rx="240" ry="220" fill="url(#glow)"/>

  <!-- Logo mark (bolt) — scaled up -->
  <g transform="translate(80, 155) scale(1.44)">
    <!-- Squircle background -->
    <rect x="0" y="0" width="180" height="180" rx="44" fill="#0D1527"/>
    <rect x="0" y="0" width="180" height="180" rx="44" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <!-- Bolt glow -->
    <path d="M104,22 L64,90 L84,90 L76,158 L118,78 L98,78 Z" fill="#1A88FF" opacity="0.40" filter="url(#softGlow)"/>
    <!-- Bolt -->
    <path d="M104,22 L64,90 L84,90 L76,158 L118,78 L98,78 Z" fill="url(#bolt)"/>
  </g>

  <!-- Brand name -->
  <text x="358" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="96" font-weight="700" fill="white" letter-spacing="-2">Strøm</text>
  <text x="710" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="96" font-weight="300" fill="#3B82F6" letter-spacing="-2">Vei</text>

  <!-- Tagline -->
  <text x="358" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="400" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">Ladekart og ruteplanlegger for elbil i Norge</text>

  <!-- Stat chips -->
  <g transform="translate(358, 400)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="210" height="50" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="18" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="white">10 000+</text>
    <text x="108" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="rgba(255,255,255,0.50)"> stasjoner</text>

    <!-- Chip 2 -->
    <rect x="228" y="0" width="178" height="50" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="18" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#3B82F6" transform="translate(228, 0)">Smart</text>
    <text x="88" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="rgba(255,255,255,0.50)" transform="translate(228, 0)"> ruteplan</text>

    <!-- Chip 3 -->
    <rect x="424" y="0" width="158" height="50" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text x="18" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#10B981" transform="translate(424, 0)">Gratis</text>
    <text x="78" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="rgba(255,255,255,0.50)" transform="translate(424, 0)"> å bruke</text>
  </g>

  <!-- Bottom URL -->
  <text x="600" y="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="rgba(255,255,255,0.25)" text-anchor="middle">stromvei-project.vercel.app</text>
</svg>
